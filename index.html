<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102332"><title>部品手配 QRスキャナー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172638;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#102332;color:white;padding:18px 16px;font-weight:700;font-size:19px}main{max-width:650px;margin:auto;padding:14px}.panel{background:white;border-radius:14px;padding:14px;margin-bottom:13px;box-shadow:0 2px 8px #0001}.hint{color:#52616f;font-size:13px;line-height:1.6}.camera{position:relative;background:#111;border-radius:10px;overflow:hidden;aspect-ratio:3/4;max-height:65vh}.camera video,.camera canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.camera canvas{touch-action:manipulation}button{border:0;border-radius:9px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#087e68;color:white}button.secondary{background:#e7eef3;color:#153249}button.danger{background:#fce9e9;color:#a12626}button:disabled{opacity:.4}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.buttons>*{flex:1}#status{min-height:1.4em}#selection{font-size:22px;font-weight:800;color:#087e68}#detected{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.candidate{background:#e0f6ee;color:#064f41;border:2px solid #42aa88}ul{padding-left:0;list-style:none}li{padding:10px 4px;border-bottom:1px solid #e4e8ec;display:flex;align-items:center;justify-content:space-between;gap:10px}.code{font-weight:700;font-variant-numeric:tabular-nums}.small{font-size:12px}.muted{color:#667}.file{display:block;margin-top:8px}footer{text-align:center;padding:16px;font-size:12px;color:#667}
</style></head><body><header>部品手配 QRスキャナー <span style="font-size:12px;font-weight:400">試作版 v1</span></header><main>
<section class="panel"><div class="hint">① カメラを起動 → ② QRが複数見える位置で「画面を停止・解析」 → ③ 目的の枠をタップ → ④ 管理IDを追加。<br>カメラ映像・管理IDはサーバーへ送信しません。</div>
<div class="camera" id="viewport"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
<div class="buttons"><button class="primary" id="start">カメラを起動</button><button class="secondary" id="freeze" disabled>画面を停止・解析</button><button class="secondary" id="resume" disabled>撮り直す</button></div>
<div class="hint" id="status" role="status">カメラを起動してください。</div>
<label class="hint file">カメラが使えない場合：写真から読み取る <input id="photo" type="file" accept="image/*" style="display:block;margin-top:6px;max-width:100%"></label>
<div id="detected"></div></section>
<section class="panel"><div class="hint">選択中の管理ID</div><div id="selection">未選択</div><div class="buttons"><button class="primary" id="add" disabled>この管理IDを追加</button></div><label class="hint" for="manual">読み取れない場合は手入力</label><div class="buttons"><input id="manual" type="text" placeholder="例：VS-0005" autocapitalize="characters" style="min-width:0;flex:2;padding:12px;border:1px solid #bbc7d0;border-radius:9px"><button class="secondary" id="manualAdd">手入力を追加</button></div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b>手配リスト（<span id="count">0</span>件）</b><button class="danger" id="clear">全削除</button></div><ul id="list"></ul><div class="buttons"><button class="primary" id="export" disabled>手配データ.csv を出力</button></div><div class="hint">CSV形式：1列目「管理ID」、以降1件につき1行。同じIDを2回追加した場合は2行出力します。</div></section>
</main><footer>試作版：実際のラベルで読取精度とCSV互換性を検証してください。</footer>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d');let stream=null,frozen=false,selected='',found=[],snapshot=null,items=[],busy=false;
const valid=s=>/^(VS|AJN)-\d{4}$/.test(s);const setStatus=s=>$('status').textContent=s;
function setSelected(s){selected=s;$('selection').textContent=s||'未選択';$('add').disabled=!valid(s)}
function resizeCanvas(w,h){overlay.width=w;overlay.height=h;}
function drawFrame(){if(!snapshot)return;ctx.clearRect(0,0,overlay.width,overlay.height);ctx.drawImage(snapshot,0,0,overlay.width,overlay.height);ctx.lineWidth=Math.max(3,overlay.width/140);ctx.font=`bold ${Math.max(18,overlay.width/28)}px sans-serif`;for(let i=0;i<found.length;i++){let f=found[i],p=f.position;if(!p)continue;let pts=[p.topLeft,p.topRight,p.bottomRight,p.bottomLeft];ctx.strokeStyle=f.text===selected?'#00d4a3':'#ffdb4d';ctx.beginPath();pts.forEach((pt,j)=>j?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.closePath();ctx.stroke();let x=Math.max(0,pts[0].x),y=Math.max(24,pts[0].y-8);let label=f.text;let tw=ctx.measureText(label).width;ctx.fillStyle='#102332';ctx.fillRect(x,y-24,tw+14,29);ctx.fillStyle='#fff';ctx.fillText(label,x+7,y-3);}}
async function decodeFrame(source){if(busy)return;busy=true;setSelected('');found=[];$('detected').replaceChildren();setStatus('QRコードを解析しています…');try{let w=source.videoWidth||source.naturalWidth||source.width,h=source.videoHeight||source.naturalHeight||source.height;if(!w||!h)throw Error('画像が取得できません');let c=document.createElement('canvas');c.width=w;c.height=h;let cc=c.getContext('2d',{willReadFrequently:true});cc.drawImage(source,0,0,w,h);snapshot=c;resizeCanvas(w,h);let result=await ZXingWASM.readBarcodes(cc.getImageData(0,0,w,h),{formats:['QRCode'],tryHarder:true,maxNumberOfSymbols:0});found=result.filter(r=>valid(r.text)&&r.position&&!r.error);drawFrame();if(found.length){setStatus(`${found.length}個の管理IDを検出しました。枠または下のIDをタップしてください。`);for(let f of found){let b=document.createElement('button');b.className='candidate';b.textContent=f.text;b.onclick=()=>{setSelected(f.text);drawFrame()};$('detected').append(b)}}else{setStatus('管理IDを検出できませんでした。距離・明るさを変えて撮り直してください。')}}catch(e){setStatus('解析エラー：'+e.message+'。通信環境とブラウザを確認してください。')}finally{busy=false}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
$('start').onclick=async()=>{try{stopCamera();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();frozen=false;snapshot=null;found=[];ctx.clearRect(0,0,overlay.width,overlay.height);$('freeze').disabled=false;$('resume').disabled=true;setStatus('QRコードが見える位置で「画面を停止・解析」を押してください。')}catch(e){setStatus('カメラ起動失敗：'+e.message+'。Safariのカメラ許可とHTTPSを確認してください。')}};
$('freeze').onclick=async()=>{if(!stream)return;frozen=true;video.pause();$('freeze').disabled=true;$('resume').disabled=false;await decodeFrame(video)};
$('resume').onclick=async()=>{if(!stream){$('start').click();return}video.play();frozen=false;snapshot=null;found=[];setSelected('');ctx.clearRect(0,0,overlay.width,overlay.height);$('detected').replaceChildren();$('freeze').disabled=false;$('resume').disabled=true;setStatus('撮り直せます。画面を停止・解析してください。')};
$('photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let url=URL.createObjectURL(f);let im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url});stopCamera();$('freeze').disabled=true;$('resume').disabled=true;await decodeFrame(im);URL.revokeObjectURL(url)}catch(err){setStatus('写真の読み込みに失敗：'+err.message)}};
overlay.onclick=e=>{if(!found.length)return;let r=overlay.getBoundingClientRect();let scale=Math.min(r.width/overlay.width,r.height/overlay.height);let ox=(r.width-overlay.width*scale)/2,oy=(r.height-overlay.height*scale)/2;let x=(e.clientX-r.left-ox)/scale,y=(e.clientY-r.top-oy)/scale;let matches=found.map(f=>{let pts=Object.values(f.position),cx=pts.reduce((a,p)=>a+p.x,0)/4,cy=pts.reduce((a,p)=>a+p.y,0)/4;return{f,d:Math.hypot(cx-x,cy-y)}}).sort((a,b)=>a.d-b.d);if(matches.length){setSelected(matches[0].f.text);drawFrame()}};
function render(){let ul=$('list');ul.replaceChildren();items.forEach((s,i)=>{let li=document.createElement('li'),sp=document.createElement('span'),b=document.createElement('button');sp.className='code';sp.textContent=`${i+1}. ${s}`;b.className='secondary small';b.textContent='削除';b.onclick=()=>{items.splice(i,1);render()};li.append(sp,b);ul.append(li)});$('count').textContent=items.length;$('export').disabled=!items.length}
function add(s){s=s.trim().toUpperCase();if(!valid(s)){alert('管理IDは VS-0001 / AJN-0005 の形式で入力してください。');return}items.push(s);render();setStatus(s+' を追加しました。')}
$('add').onclick=()=>add(selected);$('manualAdd').onclick=()=>{add($('manual').value);$('manual').value=''};$('clear').onclick=()=>{if(items.length&&confirm('手配リストをすべて削除しますか？')){items=[];render()}};
$('export').onclick=()=>{let content='\uFEFF管理ID\n'+items.join('\n')+'\n';let blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='手配データ.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
window.addEventListener('pagehide',stopCamera);render();
})();
</script></body></html>
